<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>국악 단음 샘플 테스트</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', sans-serif; background: #12111a; color: #e8e0d0; padding: 24px; min-height: 100vh; }

h1 { text-align: center; font-size: 1.3rem; color: #c9a96e; margin-bottom: 28px; letter-spacing: 3px; }

/* 악기 탭 */
.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; }
.tab {
  padding: 9px 24px; border-radius: 20px; cursor: pointer; font-size: 0.95rem;
  border: 1px solid #333; background: #1e1d2e; transition: all 0.2s; user-select: none;
}
.tab:hover  { border-color: #c9a96e; }
.tab.active { background: #c9a96e; color: #12111a; border-color: #c9a96e; font-weight: bold; }

/* 패널 */
.panel { display: none; }
.panel.active { display: block; }

/* 율명 그리드 (가야금/대금) */
.yul-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  max-width: 640px;
  margin: 0 auto 24px;
}
.yul-key {
  background: #1e1d2e; border: 1px solid #2e2d3e; border-radius: 10px;
  padding: 16px 6px; text-align: center; cursor: pointer;
  transition: all 0.12s; user-select: none;
}
.yul-key:hover { background: #2a2940; border-color: #c9a96e; transform: translateY(-2px); }
.yul-key.playing { background: #c9a96e; color: #12111a; border-color: #c9a96e; }
.yul-key .name { font-size: 1.4rem; font-weight: bold; display: block; }
.yul-key .note { font-size: 0.7rem; color: #888; margin-top: 4px; display: block; }
.yul-key.playing .note { color: #12111a88; }

/* 장구 */
.janggu-wrap { max-width: 540px; margin: 0 auto 24px; }
.janggu-body {
  background: linear-gradient(135deg, #2a1a0a 0%, #4a2c0e 50%, #2a1a0a 100%);
  border-radius: 50px; padding: 30px 20px; display: flex;
  align-items: center; justify-content: center; gap: 20px;
  border: 2px solid #6b3f10; position: relative;
  box-shadow: 0 8px 32px #0008;
}
.janggu-label { font-size: 0.8rem; color: #c9a96e88; text-align: center; margin-bottom: 8px; }
.drum-head {
  width: 130px; height: 130px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.12s; user-select: none; border: 3px solid;
  gap: 4px;
}
.drum-head .hit-name { font-size: 1.5rem; font-weight: bold; }
.drum-head .hit-desc { font-size: 0.68rem; opacity: 0.7; text-align: center; }

.kung-head {
  background: radial-gradient(circle, #3d2a1a 60%, #2a1a0a);
  border-color: #6b4010;
  box-shadow: inset 0 0 20px #0006, 0 4px 12px #0006;
}
.kung-head:hover { background: radial-gradient(circle, #5a3a22 60%, #3a2010); transform: scale(1.04); }
.kung-head.playing { background: radial-gradient(circle, #8b5a2a 60%, #5a3010); box-shadow: 0 0 24px #c9a96e88; }

.chae-head {
  background: radial-gradient(circle, #e8d5b0 60%, #c9b090);
  border-color: #a08040; color: #3a2010;
}
.chae-head:hover { background: radial-gradient(circle, #f0e0c0 60%, #d4b888); transform: scale(1.04); }
.chae-head.playing { background: radial-gradient(circle, #ffd080 60%, #e0a040); box-shadow: 0 0 24px #ffd08088; }
.chae-head .hit-desc { color: #5a3a10; }

.janggu-middle {
  width: 50px; display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.hap-btn {
  background: #c9a96e22; border: 1px solid #c9a96e55; border-radius: 8px;
  color: #c9a96e; padding: 6px 10px; cursor: pointer; font-size: 0.8rem; text-align: center;
  transition: all 0.12s;
}
.hap-btn:hover { background: #c9a96e44; }
.hap-btn.playing { background: #c9a96e; color: #12111a; }

/* 공통 컨트롤 */
.controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
.ctrl-btn {
  background: #1e1d2e; border: 1px solid #333; border-radius: 8px;
  color: #e8e0d0; padding: 8px 18px; cursor: pointer; font-size: 0.88rem;
  transition: background 0.15s;
}
.ctrl-btn:hover { background: #2a2940; border-color: #c9a96e; }
.ctrl-btn.stop { border-color: #8a3030; }
.ctrl-btn.stop:hover { background: #3a1a1a; }

.bpm-row { text-align: center; font-size: 0.85rem; color: #aaa; margin-bottom: 8px; }
.bpm-row input { margin: 0 6px; vertical-align: middle; }
.bpm-row span { color: #c9a96e; font-weight: bold; }

.status { text-align: center; color: #666; font-size: 0.82rem; margin-top: 18px; min-height: 1.2em; }
</style>
</head>
<body>
<h1>🎵 국악 단음 샘플 테스트</h1>

<div class="tabs">
  <div class="tab active" onclick="switchTab('gayageum')">가야금</div>
  <div class="tab"        onclick="switchTab('daegeum')">대금</div>
  <div class="tab"        onclick="switchTab('janggu')">장구</div>
  <div class="tab"        onclick="switchTab('ai')">🤖 AI 음원</div>
</div>

<!-- 가야금 패널 -->
<div class="panel active" id="panel-gayageum">
  <div class="yul-grid" id="grid-gayageum"></div>
  <div class="controls">
    <button class="ctrl-btn" onclick="playScale('gayageum','평조')">평조 ▶</button>
    <button class="ctrl-btn" onclick="playScale('gayageum','계면조')">계면조 ▶</button>
    <button class="ctrl-btn" onclick="playScale('gayageum','all')">전체 음계 ▶</button>
    <button class="ctrl-btn stop" onclick="stopAll()">■ 정지</button>
  </div>
</div>

<!-- 대금 패널 -->
<div class="panel" id="panel-daegeum">
  <div class="yul-grid" id="grid-daegeum"></div>
  <div class="controls">
    <button class="ctrl-btn" onclick="playScale('daegeum','평조')">평조 ▶</button>
    <button class="ctrl-btn" onclick="playScale('daegeum','계면조')">계면조 ▶</button>
    <button class="ctrl-btn" onclick="playScale('daegeum','all')">전체 음계 ▶</button>
    <button class="ctrl-btn stop" onclick="stopAll()">■ 정지</button>
  </div>
</div>

<!-- 장구 패널 -->
<div class="panel" id="panel-janggu">
  <div class="janggu-wrap">
    <div class="janggu-label">클릭하여 타법별 소리 재생</div>
    <div class="janggu-body">
      <!-- 궁편 (왼쪽) -->
      <div class="drum-head kung-head" id="hit-궁" onclick="playHit('궁')">
        <span class="hit-name" style="color:#e8d0a0">궁</span>
        <span class="hit-desc" style="color:#c9a96e88">궁편 · 저음</span>
      </div>

      <!-- 가운데: 합장단 -->
      <div class="janggu-middle">
        <div class="hap-btn" id="hit-합" onclick="playHit('합')">합<br><span style="font-size:0.7rem;opacity:0.7">양편 동시</span></div>
      </div>

      <!-- 채편 (오른쪽) -->
      <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
        <div class="drum-head chae-head" id="hit-덕" onclick="playHit('덕')">
          <span class="hit-name">덕</span>
          <span class="hit-desc">채편 · 보통</span>
        </div>
        <div class="drum-head chae-head" id="hit-따" onclick="playHit('따')" style="width:100px;height:100px">
          <span class="hit-name" style="font-size:1.2rem">따</span>
          <span class="hit-desc">채편 · 강타</span>
        </div>
      </div>
    </div>
  </div>
  <div class="controls" style="margin-top:4px">
    <button class="ctrl-btn" onclick="playJangguPattern('중모리')">중모리 패턴 ▶</button>
    <button class="ctrl-btn" onclick="playJangguPattern('자진모리')">자진모리 패턴 ▶</button>
    <button class="ctrl-btn stop" onclick="stopAll()">■ 정지</button>
  </div>
</div>

<!-- AI 음원 패널 -->
<div class="panel" id="panel-ai">
  <div style="max-width:560px;margin:0 auto 24px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div>
        <div style="font-size:0.78rem;color:#aaa;margin-bottom:4px">악기</div>
        <select id="ai-inst" style="width:100%;padding:8px;background:#1e1d2e;border:1px solid #333;border-radius:8px;color:#e8e0d0;font-size:0.9rem">
          <option>가야금</option>
          <option>대금</option>
        </select>
      </div>
      <div>
        <div style="font-size:0.78rem;color:#aaa;margin-bottom:4px">조</div>
        <select id="ai-jo" style="width:100%;padding:8px;background:#1e1d2e;border:1px solid #333;border-radius:8px;color:#e8e0d0;font-size:0.9rem">
          <option>평조</option>
          <option>계면조</option>
        </select>
      </div>
      <div>
        <div style="font-size:0.78rem;color:#aaa;margin-bottom:4px">장단</div>
        <select id="ai-jangdan" style="width:100%;padding:8px;background:#1e1d2e;border:1px solid #333;border-radius:8px;color:#e8e0d0;font-size:0.9rem">
          <option>중모리</option>
          <option>자진모리</option>
          <option>굿거리</option>
          <option>세마치</option>
          <option>중중모리</option>
          <option>휘모리</option>
          <option>엇모리</option>
          <option>진양조</option>
        </select>
      </div>
      <div>
        <div style="font-size:0.78rem;color:#aaa;margin-bottom:4px">마디 수 (길이)</div>
        <select id="ai-bars" style="width:100%;padding:8px;background:#1e1d2e;border:1px solid #333;border-radius:8px;color:#e8e0d0;font-size:0.9rem">
          <option value="16">16마디 (~2분)</option>
          <option value="32" selected>32마디 (~5분)</option>
          <option value="64">64마디 (~10분)</option>
          <option value="96">96마디 (~15분)</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:0.78rem;color:#aaa;margin-bottom:4px">BPM: <span id="ai-bpm-val" style="color:#c9a96e;font-weight:bold">80</span></div>
      <input type="range" id="ai-bpm" min="40" max="160" value="80" style="width:100%"
             oninput="document.getElementById('ai-bpm-val').textContent=this.value">
    </div>
    <button id="ai-gen-btn" class="ctrl-btn" style="width:100%;padding:14px;font-size:1rem;border-color:#c9a96e;color:#c9a96e;margin-bottom:12px"
            onclick="generateAI()">🎵 AI 음원 생성</button>
    <div id="ai-progress" style="display:none;text-align:center;padding:12px;color:#c9a96e;font-size:0.88rem">
      ⏳ AI가 음악을 작곡하는 중... (마디 수에 따라 수초 소요)
    </div>
    <audio id="ai-audio" controls style="display:none;width:100%;margin-top:8px;filter:invert(1) hue-rotate(180deg)"></audio>
    <div id="ai-info" style="text-align:center;font-size:0.78rem;color:#666;margin-top:6px"></div>
  </div>
</div>

<!-- 공통 하단 -->
<div class="bpm-row">
  BPM: <input type="range" id="bpm" min="40" max="200" value="80" oninput="document.getElementById('bpmVal').textContent=this.value">
  <span id="bpmVal">80</span>
  &nbsp;&nbsp; 볼륨: <input type="range" id="vol" min="0" max="1" step="0.05" value="0.85">
</div>
<div class="status" id="status">악기를 선택하고 클릭하여 소리를 들어보세요</div>

<script>
const YUL_INFO = {
  '황':{'note':'G'},  '대':{'note':'Ab'}, '태':{'note':'A'},
  '협':{'note':'Bb'}, '고':{'note':'B'},  '중':{'note':'C'},
  '유':{'note':'C#'}, '임':{'note':'D'},  '이':{'note':'Eb'},
  '남':{'note':'E'},  '무':{'note':'F'},  '응':{'note':'F#'},
};
const ORDER_ALL   = ['황','대','태','협','고','중','유','임','이','남','무','응'];
const SCALE = {
  '평조':   ['황','태','중','임','남'],
  '계면조': ['황','중','임','남','응'],
};
const INST_MAP = { gayageum:'가야금', daegeum:'대금', janggu:'장구' };
const JANGGU_PATTERNS = {
  '중모리':   ['궁','궁','덕','따','궁','덕','따','따'],
  '자진모리': ['궁','덕','궁','따','궁','덕','따','덕'],
};

let audioCtx = null;
let buffers = {};
let seqTimers = [];
let currentTab = 'gayageum';

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

async function loadBuf(inst, name) {
  const key = `${inst}/${name}`;
  if (buffers[key]) return buffers[key];
  const url = `/static/samples/${encodeURIComponent(inst)}/${encodeURIComponent(name)}.wav`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) { setStatus(`⚠ 로드 실패: ${url}`); return null; }
    const arr = await resp.arrayBuffer();
    buffers[key] = await getCtx().decodeAudioData(arr);
    return buffers[key];
  } catch(e) { setStatus(`⚠ ${e.message}`); return null; }
}

async function playSound(inst, name, elemId) {
  const buf = await loadBuf(inst, name);
  if (!buf) return;
  const ctx = getCtx();
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.value = parseFloat(document.getElementById('vol').value);
  src.connect(gain).connect(ctx.destination);
  src.start();
  setStatus(`▶ ${inst} · ${name}`);
  if (elemId) {
    const el = document.getElementById(elemId);
    if (el) {
      el.classList.add('playing');
      src.onended = () => el.classList.remove('playing');
    }
  }
  return new Promise(res => { src.onended = () => { res(); }; });
}

async function playYul(inst, yul) {
  await playSound(inst, yul, `key-${inst}-${yul}`);
}

async function playHit(label) {
  await playSound('장구', label, `hit-${label}`);
}

async function playScale(instKey, scaleName) {
  stopAll();
  const inst = INST_MAP[instKey];
  const yuls = scaleName === 'all' ? ORDER_ALL : (SCALE[scaleName] || []);
  const bpm  = parseInt(document.getElementById('bpm').value);
  const interval = 60000 / bpm;
  setStatus(`▶ ${inst} ${scaleName} 재생 중...`);

  for (let i = 0; i < yuls.length; i++) {
    await playSound(inst, yuls[i], `key-${instKey}-${yuls[i]}`);
    await sleep(interval * 0.25);
  }
  setStatus('재생 완료');
}

async function playJangguPattern(jangdanName) {
  stopAll();
  const pattern = JANGGU_PATTERNS[jangdanName] || ['궁','덕','따'];
  const bpm = parseInt(document.getElementById('bpm').value);
  const interval = 60000 / bpm;
  setStatus(`▶ 장구 ${jangdanName} 패턴 재생 중...`);

  for (let rep = 0; rep < 2; rep++) {
    for (const hit of pattern) {
      await playSound('장구', hit, `hit-${hit}`);
      await sleep(interval * 0.5);
    }
  }
  setStatus('재생 완료');
}

function sleep(ms) {
  return new Promise(res => { const t = setTimeout(res, ms); seqTimers.push(t); });
}

function stopAll() {
  seqTimers.forEach(t => clearTimeout(t));
  seqTimers = [];
  if (audioCtx) { audioCtx.close(); audioCtx = null; buffers = {}; }
  document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
  setStatus('정지');
}

function switchTab(key) {
  currentTab = key;
  const keys = ['gayageum','daegeum','janggu','ai'];
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', keys[i] === key);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${key}`).classList.add('active');
}

async function generateAI() {
  const inst    = document.getElementById('ai-inst').value;
  const jo      = document.getElementById('ai-jo').value;
  const jangdan = document.getElementById('ai-jangdan').value;
  const bars    = document.getElementById('ai-bars').value;
  const bpm     = document.getElementById('ai-bpm').value;

  const btn      = document.getElementById('ai-gen-btn');
  const progress = document.getElementById('ai-progress');
  const audio    = document.getElementById('ai-audio');
  const info     = document.getElementById('ai-info');

  btn.disabled = true;
  btn.textContent = '생성 중...';
  progress.style.display = 'block';
  audio.style.display = 'none';
  info.textContent = '';

  const params = new URLSearchParams({ instrument: inst, jo, jangdan, n_bars: bars, bpm });
  const url = `/api/generate/preview?${params}`;

  try {
    const resp = await fetch(url);
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      throw new Error(err.detail || resp.statusText);
    }
    const blob = await resp.blob();
    const objUrl = URL.createObjectURL(blob);
    audio.src = objUrl;
    audio.style.display = 'block';
    audio.play();
    const durMin = Math.round(parseInt(bars) * 12 * (60 / parseFloat(bpm)) / 60 * 10) / 10;
    info.textContent = `${inst} · ${jo} · ${jangdan} · ${bars}마디 · BPM ${bpm} · 약 ${durMin}분`;
    setStatus(`▶ AI 음원 재생 중: ${inst} ${jo} ${jangdan}`);
  } catch(e) {
    setStatus(`⚠ 생성 실패: ${e.message}`);
    info.textContent = `오류: ${e.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🎵 AI 음원 생성';
    progress.style.display = 'none';
  }
}

function buildYulGrid(instKey, inst) {
  const grid = document.getElementById(`grid-${instKey}`);
  ORDER_ALL.forEach(yul => {
    const div = document.createElement('div');
    div.className = 'yul-key';
    div.id = `key-${instKey}-${yul}`;
    div.innerHTML = `<span class="name">${yul}</span><span class="note">${YUL_INFO[yul].note}</span>`;
    div.onclick = () => playYul(inst, yul);
    grid.appendChild(div);
  });
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

buildYulGrid('gayageum', '가야금');
buildYulGrid('daegeum',  '대금');
</script>
</body>
</html>
